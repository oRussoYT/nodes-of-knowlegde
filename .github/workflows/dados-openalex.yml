name: Dados OpenAlex

# Coleta pessoas reais publicadas (OpenAlex) para os Nós. O resultado é
# gravado num ramo à parte (dados-openalex-saida) para revisão; nada entra
# no banco sozinho.
on:
  push:
    branches: [dados-openalex]

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coletar
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/data/openalex-node-people.mjs mamiraua "Mamirauá" "Mamirauá" 150 2>&1 | tee log-mamiraua.txt || true
      - name: Gravar no ramo de saída
        if: always()
        run: |
          mkdir -p /tmp/out && cp openalex-*.json log-*.txt /tmp/out/ 2>/dev/null || true
          git config user.name "dados-bot"
          git config user.email "dados-bot@users.noreply.github.com"
          git checkout --orphan dados-openalex-saida-2
          git rm -rfq .
          cp /tmp/out/* . 2>/dev/null || true
          git add -A
          git commit -qm "Saída da coleta OpenAlex" || true
          git push -f origin dados-openalex-saida-2
