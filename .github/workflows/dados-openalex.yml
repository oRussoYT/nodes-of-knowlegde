name: Dados OpenAlex

# Coleta pessoas reais publicadas (OpenAlex) para um Nó. Só roda quando
# alguém aciona. O resultado é gravado num ramo à parte para revisão e vira
# uma migração; nada entra no banco sozinho.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Nó (ex.: pdbff)"
        required: true
      institution:
        description: "Instituição no OpenAlex"
        required: true
      phrase:
        description: "Frase nas publicações (se a instituição não estiver no OpenAlex)"
        required: true
      max:
        description: "Máximo de pessoas"
        required: false
        default: "150"

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/data/openalex-node-people.mjs "${{ inputs.slug }}" "${{ inputs.institution }}" "${{ inputs.phrase }}" "${{ inputs.max }}" 2>&1 | tee log.txt
      - name: Gravar no ramo de saída
        if: always()
        run: |
          mkdir -p /tmp/out && cp openalex-*.json log.txt /tmp/out/ 2>/dev/null || true
          git config user.name "dados-bot"
          git config user.email "dados-bot@users.noreply.github.com"
          git checkout --orphan "dados-saida-${{ inputs.slug }}"
          git rm -rfq .
          cp /tmp/out/* . 2>/dev/null || true
          git add -A
          git commit -qm "Saída da coleta OpenAlex" || true
          git push -f origin "dados-saida-${{ inputs.slug }}"
