name: Dados OpenAlex

# Coleta pessoas reais publicadas (OpenAlex) para um Nó. Só roda quando
# alguém aciona; o resultado vira um arquivo para revisão, nada entra no
# banco sozinho.
on:
  push:
    branches: [dados-openalex]
  workflow_dispatch:
    inputs:
      slug:
        description: "Nó (ex.: pdbff)"
        required: true
      search:
        description: "Instituição no OpenAlex"
        required: true
      max:
        description: "Máximo de pessoas"
        required: false
        default: "150"

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: github.event_name == 'workflow_dispatch'
        run: node scripts/data/openalex-node-people.mjs "${{ inputs.slug }}" "${{ inputs.search }}" "${{ inputs.max }}"
      - if: github.event_name == 'push'
        run: |
          node scripts/data/openalex-node-people.mjs pdbff "Biological Dynamics of Forest Fragments" 200
          node scripts/data/openalex-node-people.mjs mamiraua "Instituto de Desenvolvimento Sustentável Mamirauá" 150
      - uses: actions/upload-artifact@v4
        with:
          name: openalex-dados
          path: openalex-*.json
