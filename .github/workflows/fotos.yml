# Baixa as fotos da página inicial (Wikimedia Commons, licenças livres) e as
# guarda no próprio site, em public/photos/, para não depender de links
# externos. Roda só quando acionado à mão (aba Actions → "Fotos").
name: Fotos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar as fotos
        shell: python
        run: |
          import json, os, time, urllib.parse, urllib.request
          UA = "NodesBDFFP/1.0 (https://nodesofknowlegde.netlify.app; contact via GitHub oRussoYT)"
          FILES = {
              "aerial": "Aerial view of the Amazon Rainforest.jpg",
              "satellite": "Amazon rainforest (Satellite picture) - 3.jpg",
              "camp": "Acampamento em Área Devassada da Floresta Amazônica - 813, Acervo do Museu Paulista da USP.jpg",
              "canopy": "ACTS Canopy Walkway - Flickr - pellaea (3).jpg",
              "river": "Amazon CIAT (3).jpg",
              "flooded": "Floresta Amazônica - Iranduba.jpeg",
              "mist": "Floresta amazônica.jpg",
              "clouds": "Amazon CIAT (5).jpg",
          }
          os.makedirs("public/photos", exist_ok=True)
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()
          failed = []
          for name, title in FILES.items():
              for width in (1920, 960):
                  try:
                      q = urllib.parse.urlencode({"action": "query", "titles": "File:" + title, "prop": "imageinfo",
                                                  "iiprop": "url", "iiurlwidth": width, "format": "json"})
                      info = json.loads(get("https://commons.wikimedia.org/w/api.php?" + q))
                      page = next(iter(info["query"]["pages"].values()))
                      url = page["imageinfo"][0]["thumburl"]
                      data = get(url)
                      with open(f"public/photos/{name}-{width}.jpg", "wb") as f:
                          f.write(data)
                      print(name, width, len(data), url)
                  except Exception as e:
                      print(f"::error::{name} {width}: {e}")
                      failed.append(f"{name}-{width}")
                  time.sleep(1.5)
          if failed:
              raise SystemExit("failed: " + ", ".join(failed))
      - name: Guardar no repositório
        run: |
          ls -la public/photos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos
          git commit -m "Home page photos from Wikimedia Commons" || echo "nothing new"
          git push
