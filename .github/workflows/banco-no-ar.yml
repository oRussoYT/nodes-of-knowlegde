# Leva as mudanças do banco de dados para o Supabase hospedado (o site no ar).
#
# Roda sozinho depois que os "Testes" passam na branch main — nada chega ao
# banco do site com teste vermelho. Também pode ser rodado à mão na aba
# Actions ("Banco no ar" → "Run workflow"), com a opção de carregar os dados
# de demonstração (fictícios, marcados como tal; apagáveis com
# `select wipe_demo_data();` no painel do Supabase).
#
# Precisa de dois segredos no GitHub (Settings → Secrets and variables →
# Actions):
#   SUPABASE_ACCESS_TOKEN  — gerado em supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   — a senha do banco escolhida ao criar o projeto
name: Banco no ar

on:
  workflow_run:
    workflows: [Testes]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      demonstracao:
        description: "Carregar também os dados de demonstração (fictícios)"
        type: boolean
        default: false

concurrency:
  group: banco-no-ar
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: stxvicpqqzpbwenoppma

jobs:
  enviar:
    name: Enviar migrações ao Supabase hospedado
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Conferir os segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltam os segredos SUPABASE_ACCESS_TOKEN e/ou SUPABASE_DB_PASSWORD no GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Ligar ao projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Enviar migrações
        if: github.event_name != 'workflow_dispatch' || inputs.demonstracao != true
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Enviar migrações e dados de demonstração
        if: github.event_name == 'workflow_dispatch' && inputs.demonstracao == true
        run: supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD" --yes
