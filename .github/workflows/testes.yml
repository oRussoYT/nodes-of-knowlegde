# Testes automáticos — rodam no GitHub a cada envio (push) e a cada pull request.
# Substituem o "npm run verify" no Mac e o vigia ship-watch.sh.
#
# Duas pistas (REGRAS.md):
#   1. rapido   — revisão de código, tipos, testes unitários e build (poucos minutos)
#   2. completo — banco de dados real (Supabase local no GitHub), testes pgTAP
#                 e testes de tela com Playwright
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapido:
    name: Rápido (código, tipos, unitários, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisão de código (lint)
        run: |
          set +e
          npm run lint > lint.log 2>&1
          code=$?
          cat lint.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error|warning|^/" lint.log | tail -n 40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Lint::$msg"
          fi
          exit $code
      - name: Tipos (typecheck)
        run: npm run typecheck
      - name: Testes unitários
        run: npm test
      - name: Build (o mesmo que vai ao ar na Cloudflare)
        run: |
          set +e
          npm run build:pages > cf.log 2>&1
          code=$?
          cat cf.log
          if [ $code -ne 0 ]; then
            msg=$(tail -n 40 cf.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Cloudflare build::$msg"
          fi
          exit $code

  completo:
    name: Completo (banco + telas) ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: rapido
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Ligar o Supabase local (aplica todas as migrações)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Testes do banco (pgTAP)
        if: matrix.shard == 1
        run: npx supabase test db

      - name: Preparar variáveis para o app
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } > .env.local

      - name: Montar o site (versão de produção)
        run: |
          set -a; . ./.env.local; set +a
          npm run build

      - name: Instalar navegador dos testes de tela
        run: npx playwright install --with-deps chromium

      - name: Testes de tela (Playwright) — parte ${{ matrix.shard }} de 4
        env:
          PLAYWRIGHT_WEB_COMMAND: npm run start
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Guardar relatório se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Desligar o Supabase
        if: always()
        run: npx supabase stop --no-backup
