# Configuração da Netlify (publicação do site).
# A Netlify detecta o Next.js e instala sozinha o adaptador oficial.
# As chaves do Supabase hospedado NÃO ficam aqui: são cadastradas no painel da
# Netlify (Site configuration → Environment variables):
#   NEXT_PUBLIC_SITE_URL
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
