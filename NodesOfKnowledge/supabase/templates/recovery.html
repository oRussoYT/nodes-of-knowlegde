<h2>Reset your NetPDBFF password</h2>

<p>
  We received a request to reset the password for your NetPDBFF account.
  Follow the link below to choose a new one.
</p>

<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/update-password"
    >Reset my password</a
  >
</p>

<p>
  If you didn't request a password reset, you can safely ignore this email —
  your password will not be changed.
</p>
